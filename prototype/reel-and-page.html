function streak(){let n=0,d=new Date();const set=new Set(st.days);for(;;){const k=d.toISOString().slice(0,10);if(set.has(k)){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}return n}
function theme(){const words={"choice":"choices","chooses":"choices","duty":"duty","love":"love","money":"money","arithmetic":"money","sane":"self-deception","pose":"self-deception","role":"self-deception","real":"what's real"};const c={};st.quotes.forEach(q=>Object.keys(words).forEach(w=>{if(q.text.toLowerCase().includes(w))c[words[w]]=(c[words[w]]||0)+1}));const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return top?top[0]:"first impressions"}

  <label class="switch" for="aiTog"><span><b style="font-weight:600">Reflection on my quotes</b><br><span class="muted" style="font-size:.82rem">Finds a theme in what you save and suggests a question. Off unless you turn it on.</span></span><input type="checkbox" id="aiTog" ${st.ai?"checked":""}></label>
  ${st.ai?`<div class="reflect" style="margin-top:10px"><span class="mono" style="color:var(--accent)">This week's theme · ${theme()}</span><span>Several lines you saved are about ${theme()}. Where in your own week did you face something similar?</span><span class="muted" style="font-size:.75rem">A prompt for reflection, not therapy or advice.</span></div>
  <div class="quote" style="margin-top:10px"><span class="mono" style="color:var(--brass)">Weekly summary</span><div class="line"><span>Listening time</span><span class="price">${Math.round(st.secs/60)} min</span></div><div class="line"><span>Quotes saved this week</span><span class="price">${st.quotes.filter(q=>(new Date()-new Date(q.at+"T12:00"))<7*864e5).length}</span></div><div class="line"><span>Main theme</span><span class="price">${theme()}</span></div></div>`:""}
  <div style="display:grid;gap:10px;margin-top:16px">${st.quotes.length?st.quotes.slice().reverse().map((q,k)=>`<div class="quote"><p>${esc(q.text)}</p><span class="mono muted">${esc(q.src)} · ${new Date(q.at+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}${q.sample?" · example":""}</span></div>`).join(""):'<div class="empty">No quotes yet. Start an episode and tap the pen.</div>'}</div>`;

/* ---------- render ---------- */
function render(){
  const s=$("#screen");
  s.innerHTML=ui.detail?(ui.detail.startsWith("b-")?bundleView(ui.detail):detail(ui.detail)):({home,catalog,club,quotes,profile})[ui.tab]();
  document.querySelectorAll("#tabs button").forEach(b=>b.dataset.tab===ui.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const q=$("#q"); if(q){q.oninput=e=>{ui.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  const cf=$("#chatForm"); if(cf)cf.onsubmit=e=>{e.preventDefault();const v=$("#chatIn").value.trim();if(!v)return;st.chat.push({who:"You",me:1,t:v});save();render();const m=$("#screen");m.scrollTop=m.scrollHeight;$("#chatIn").focus()};
  const qf=$("#qForm"); if(qf)qf.onsubmit=e=>{e.preventDefault();const v=$("#qIn").value.trim();if(!v)return;st.qs.push({who:"You",q:v});save();render();toast("Question sent to "+HOST)};
  const ai=$("#aiTog"); if(ai)ai.onchange=e=>{st.ai=e.target.checked;save();render()};
  const rs=$("#reset"); if(rs)rs.onclick=()=>{["owned","member","quotes","pos","chat","qs","secs","days","ai","blocked"].forEach(k=>{try{localStorage.removeItem("rp2_"+k)}catch(e){}});location.reload()};
  renderMini(); placePen();
}
function placePen(){const mini=!$("#mini").hidden;$("#pen").style.bottom=(mini?140:84)+"px";$("#pen").hidden=!pl.id}

/* ---------- player ---------- */
function startPlay(id,part){
  const i=item(id); if(!i)return;
  const acc=hasAccess(i);
  if(!acc&&part>0){openBuy(id);return}
  if(acc&&!partOpen(i,part)){toast("This episode opens later this month");return}
  if(pl.id!==id||pl.part!==part){const saved=st.pos[id];pl.id=id;pl.part=part;pl.t=(saved&&saved.part===part)?saved.t:0}
  if(!acc&&pl.t>=PREVIEW)pl.t=0;
  pl.playing=true; openPlayer(); tick.start();
}
const tick={h:null,start(){if(this.h)return;this.h=setInterval(step,1000)},stop(){clearInterval(this.h);this.h=null}};
function step(){
  if(!pl.playing){tick.stop();return}
  const i=item(pl.id), p=i.parts[pl.part], acc=hasAccess(i);
  pl.t+=pl.speed; st.secs+=1;
  if(!st.days.includes(today()))st.days.push(today());
  if(!acc&&pl.t>=PREVIEW){pl.t=PREVIEW;pl.playing=false;persist();updPlayer();renderMini();openBuy(i.id,"Your 5-minute preview has ended.");return}
  if(pl.t>=p.d){pl.t=0;const nx=pl.part+1;if(nx<i.parts.length&&partOpen(i,nx)&&pl.sleep!=="end"){pl.part=nx;toast("Next: "+i.parts[nx].t)}else{pl.playing=false;pl.part=Math.min(nx,i.parts.length-1);if(pl.sleep==="end")pl.sleep=0}}
  if(pl.sleep&&pl.sleep!=="end"){pl.sleepLeft-=1;if(pl.sleepLeft<=0){pl.playing=false;pl.sleep=0;toast("Sleep timer paused playback")}}
  if(Math.floor(pl.t)%5===0)persist();
  updPlayer(); renderMini();
}
function persist(){st.pos[pl.id]={part:pl.part,t:pl.t};save()}
function curPara(){const i=item(pl.id),p=i.parts[pl.part];return Math.min(p.x.length-1,Math.floor(pl.t/p.d*p.x.length))}
function openPlayer(){
  const i=item(pl.id), acc=hasAccess(i);
  $("#player").innerHTML=`<div class="player">
    <div class="topbar"><button class="back" id="closePl">↓ Close</button><span class="mono muted">Episode ${pl.part+1} of ${i.parts.length}</span></div>
    ${poster(i)}
    <div class="center"><h2 class="title" style="font-size:1.5rem" id="plPart">${esc(i.parts[pl.part].t)}</h2><div class="muted">${esc(i.title)} · ${HOST}</div></div>
    <input type="range" class="scrub" id="scrub" min="0" step="1" aria-label="Position">
    <div class="times"><span id="tNow"></span><span id="tEnd"></span></div>
    <div class="controls"><button class="ibtn" id="back15" aria-label="Back 15 seconds">−15</button><button class="ibtn main" id="pp" aria-label="Play or pause"></button><button class="ibtn" id="fwd30" aria-label="Forward 30 seconds">+30</button></div>
    <div class="opts"><button class="chip" id="spd"></button><button class="chip" id="slp"></button></div>
    ${acc?"":`<div class="preview-note">Preview · the first 5 minutes are free. <button class="btn small" data-buy="${i.id}" style="margin-left:6px">Unlock ${money(i.price)}</button></div>`}
    <div class="transcript" id="tr"></div></div>`;
  $("#player").hidden=false; updPlayer();
  $("#closePl").onclick=()=>{$("#player").hidden=true;persist();render()};
  $("#pp").onclick=()=>{pl.playing=!pl.playing;if(pl.playing){if(!acc&&pl.t>=PREVIEW){openBuy(i.id);pl.playing=false}else tick.start()}persist();updPlayer();renderMini()};
  $("#back15").onclick=()=>{pl.t=Math.max(0,pl.t-15);updPlayer()};
  $("#fwd30").onclick=()=>{const lim=acc?i.parts[pl.part].d-1:PREVIEW-1;pl.t=Math.min(lim,pl.t+30);updPlayer()};
  $("#scrub").oninput=e=>{pl.t=+e.target.value;updPlayer()};
  $("#spd").onclick=()=>{const sp=[1,1.25,1.5,2,.75];pl.speed=sp[(sp.indexOf(pl.speed)+1)%sp.length];updPlayer()};
  $("#slp").onclick=()=>{const o=[0,15,30,"end"];pl.sleep=o[(o.indexOf(pl.sleep)+1)%o.length];pl.sleepLeft=typeof pl.sleep==="number"?pl.sleep*60:0;updPlayer()};
  placePen();
}
function updPlayer(){
  if($("#player").hidden||!pl.id)return;
  const i=item(pl.id),p=i.parts[pl.part],acc=hasAccess(i),max=acc?p.d:Math.min(p.d,PREVIEW);
  const sc=$("#scrub"); if(!sc)return;
  sc.max=max; sc.value=pl.t; $("#plPart").textContent=p.t;
  $("#tNow").textContent=mmss(pl.t); $("#tEnd").textContent=(acc?"−":"preview ")+mmss(max-pl.t);
  $("#pp").textContent=pl.playing?"❚❚":"▶";
  $("#spd").textContent=pl.speed+"×";
  $("#slp").textContent=pl.sleep===0?"Sleep timer: off":pl.sleep==="end"?"Sleep: end of episode":"Sleep: "+Math.ceil(pl.sleepLeft/60)+" min";
  const k=curPara(); $("#tr").innerHTML=`<span class="mono muted">Transcript</span>`+p.x.map((x,n)=>`<p class="${n===k?"on":""}">${esc(x)}</p>`).join("");
}
function renderMini(){
  const m=$("#mini"); if(!pl.id){m.hidden=true;return}
  const i=item(pl.id),p=i.parts[pl.part];
  m.hidden=false;
  m.innerHTML=`<div class="bar" style="width:${(pl.t/p.d*100).toFixed(1)}%"></div><button class="open" id="openPl"><b>${esc(i.title)}</b><span>${esc(p.t)} · ${mmss(pl.t)}</span></button><button class="ibtn" id="mBack" aria-label="Back 15 seconds" style="font-family:var(--mono);font-size:.68rem">−15</button><button class="ibtn main" id="mPP" aria-label="Play or pause">${pl.playing?"❚❚":"▶"}</button>`;
  $("#openPl").onclick=openPlayer;
  $("#mBack").onclick=()=>{pl.t=Math.max(0,pl.t-15);renderMini()};
  $("#mPP").onclick=()=>{const acc=hasAccess(i);if(!pl.playing&&!acc&&pl.t>=PREVIEW){openBuy(i.id);return}pl.playing=!pl.playing;if(pl.playing)tick.start();persist();renderMini()};
  placePen();
}

/* ---------- purchases ---------- */
function openBuy(what,note){
  let name,amt,desc;
  if(what==="club"){name="Club membership";amt=CLUB.price;desc="Billed monthly, renews automatically. Cancel anytime in settings."}
  else if(what.startsWith("b-")){const b=BUNDLES.find(x=>x.id===what);name="Collection: "+b.title;amt=b.price;desc="One-time purchase. All "+b.ids.length+" commentaries stay yours."}
  else{const i=item(what);name=i.title+" · full commentary";amt=i.price;desc="One-time purchase. Yours to keep, with all "+i.parts.length+" episodes."}
  $("#sheetBody").innerHTML=`${note?`<span class="mono" style="color:var(--brass)">${esc(note)}</span>`:""}<h3>${what==="club"?"Join the club":"Unlock"}</h3>
   <div class="line"><span>${esc(name)}</span><span class="price">${money(amt)}${what==="club"?"/mo":""}</span></div>
   <span class="muted" style="font-size:.86rem">${desc}</span>
   <div class="demo">Prototype checkout. In the live app this step opens Apple or Google payment. No money is charged here.</div>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cBuy">Not now</button><button class="btn" id="oBuy">Pay ${money(amt)}</button></div>`;
  $("#sheet").hidden=false; $("#oBuy").focus();
  $("#cBuy").onclick=()=>$("#sheet").hidden=true;
  $("#oBuy").onclick=()=>{
    if(what==="club")st.member=true;
    else if(what.startsWith("b-"))BUNDLES.find(x=>x.id===what).ids.forEach(x=>st.owned.add(x));
    else st.owned.add(what);
    save(); $("#sheet").hidden=true; toast(what==="club"?"Welcome to the club":"Unlocked. It's yours to keep.");
    if(!$("#player").hidden)openPlayer(); render();
  };
}

function memberMenu(name){
  $("#sheetBody").innerHTML=`<h3>${esc(name)}</h3><span class="muted" style="font-size:.88rem">Reports go to the moderators, who review them. Blocking hides this member's messages from you right away; you can undo it in Profile.</span>
   <button class="btn ghost" id="mRep">Report message</button><button class="btn" id="mBlk">Block ${esc(name)}</button><button class="btn ghost" id="mCan">Cancel</button>`;
  $("#sheet").hidden=false;
  $("#mCan").onclick=()=>$("#sheet").hidden=true;
  $("#mRep").onclick=()=>{$("#sheet").hidden=true;toast("Report sent to moderators")};
  $("#mBlk").onclick=()=>{if(!st.blocked.includes(name))st.blocked.push(name);save();$("#sheet").hidden=true;render();toast(name+" is blocked")};
}
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

/* ---------- events ---------- */
$("#app").addEventListener("click",e=>{
  const g=(s)=>e.target.closest(s);
  let el;
  if((el=g("[data-buy]"))){openBuy(el.dataset.buy);return}
  if((el=g("[data-play]"))){startPlay(el.dataset.play,+el.dataset.part);return}
  if((el=g("[data-item]"))){ui.detail=el.dataset.item;$("#player").hidden=true;render();$("#screen").scrollTop=0;return}
  if((el=g("[data-bundle]"))){ui.detail=el.dataset.bundle;render();$("#screen").scrollTop=0;return}
  if((el=g("[data-back]"))){ui.detail=null;render();return}
  if((el=g("[data-tab]"))){ui.tab=el.dataset.tab;ui.detail=null;$("#player").hidden=true;render();$("#screen").scrollTop=0;return}
  if((el=g("[data-filter]"))){ui.filter=el.dataset.filter;render();return}
  if((el=g("[data-clubtab]"))){ui.clubTab=el.dataset.clubtab;render();return}
  if((el=g("[data-member]"))){memberMenu(el.dataset.member);return}
  if((el=g("[data-unblock]"))){st.blocked=st.blocked.filter(n=>n!==el.dataset.unblock);save();render();toast("Unblocked");return}
  if(e.target.id==="sheet")$("#sheet").hidden=true;
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheet").hidden)$("#sheet").hidden=true;else if(!$("#player").hidden){$("#player").hidden=true;render()}}});
$("#pen").onclick=()=>{
  if(!pl.id){toast("Start an episode first, then tap the pen");return}
  const i=item(pl.id),p=i.parts[pl.part],line=p.x[curPara()];
  if(st.quotes.some(q=>q.text===line)){toast("Already in your quotes");return}
  st.quotes.push({text:line,src:i.title+" · "+p.t,at:today()});save();toast("Saved to your quotes");
  if(ui.tab==="quotes"&&!ui.detail)render();
};

render();
</script>
